<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Reviews</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Customer Reviews</h1>
        <p><a href="/reviews/new" class="button">Add New Review</a></p>
        <table>
            <thead>
                <tr>
                    <th>Author</th>
                    <th>Title</th>
                    <th>Content</th>
                    <th>Rating</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="review : ${reviews}">
                    <td th:text="${review.author}"></td>
                    <td th:text="${review.title}"></td>
                    <td th:text="${review.content}"></td>
                    <td th:text="${review.rating}"></td>
                    <td th:text="${review.created}"></td>
                    <td>
                        <a th:href="@{/reviews/edit/{id}(id=${review.id})}">Edit</a>
                        <a th:href="@{/reviews/delete/{id}(id=${review.id})}" onclick="return confirm('Are you sure you want to delete this review?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
