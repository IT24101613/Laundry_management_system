<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Card Payment</title>
    <style>
        body {
            background-color: #0a1f44;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background-color: #1e3a8a;
            padding: 20px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #3b82f6;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Enter Card Details</h2>
    <form th:action="@{/payments/pay/card}" method="post">
        <!-- Hidden fields for orderId and amount -->
        <input type="hidden" name="orderId" th:value="${orderId}" />
        <input type="hidden" name="amount" th:value="${amount}" />

        <label>Cardholder Name:</label>
        <input type="text" name="cardholderName" required />

        <label>Card Number:</label>
        <input type="text" name="cardNumber" maxlength="16" required />

        <label>Expiry Date:</label>
        <input type="month" name="expiryDate" required />

        <label>CVV:</label>
        <input type="password" name="cvv" maxlength="3" required />

        <div class="button-group">
            <button type="submit">Confirm Payment</button>
            <button type="reset">Edit</button>
        </div>
    </form>
</div>
</body>
</html>
